# The Telegram client for Symbian, built on the epoc SDK.
#
# Its own workspace now: the fields below used to be inherited from the SDK's root manifest,
# and the SDK crates used to be path dependencies two directories up. Both are pinned here
# instead — see the note at the top of README.md for how to build against a local checkout
# instead of the published SDK.

[workspace]
members = [".", "proto"]
# device/ is deliberately absent: it is a no_std staticlib carrying a #[panic_handler], which
# collides with std's when cargo builds the test harness. It is its own workspace root, built
# only for the ARM target.
exclude = ["device"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
tg-proto = { path = "proto" }
# The SDK. Pinned by revision rather than by branch so a build is reproducible: bump these
# deliberately, together, and run the device build before trusting the result.
symbian = { git = "https://github.com/Lab2021/epoc", rev = "7b4c21dbd3d512a8c2ca8cca3a12c83e9b1bd9c1" }
symbian-ui = { git = "https://github.com/Lab2021/epoc", rev = "7b4c21dbd3d512a8c2ca8cca3a12c83e9b1bd9c1" }
symbian-gfx = { git = "https://github.com/Lab2021/epoc", rev = "7b4c21dbd3d512a8c2ca8cca3a12c83e9b1bd9c1" }
symbian-sys = { git = "https://github.com/Lab2021/epoc", rev = "7b4c21dbd3d512a8c2ca8cca3a12c83e9b1bd9c1" }
symbian-app = { git = "https://github.com/Lab2021/epoc", rev = "7b4c21dbd3d512a8c2ca8cca3a12c83e9b1bd9c1" }
symbian-crypto = { git = "https://github.com/Lab2021/epoc", rev = "7b4c21dbd3d512a8c2ca8cca3a12c83e9b1bd9c1" }
symbian-sim = { git = "https://github.com/Lab2021/epoc", rev = "7b4c21dbd3d512a8c2ca8cca3a12c83e9b1bd9c1" }
symbian-preview = { git = "https://github.com/Lab2021/epoc", rev = "7b4c21dbd3d512a8c2ca8cca3a12c83e9b1bd9c1" }

# Mirrors the SDK's device profile: small binaries matter on a phone with ~30 MB of usable
# RAM and a ~100 KB-per-page demand loader.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
debug = false
overflow-checks = false

[package]
name = "tg"
description = "Telegram client for Symbian — UI first, protocol later"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
# Named rather than inherited: this crate's home is its own repository, not the SDK's. See
# the note at the top of README.md.
repository = "https://github.com/Lab2021/tg"

[lib]
# A plain rlib. The device build wraps this in a thin staticlib crate that
# supplies #[global_allocator], #[panic_handler] and the extern "C" entry points
# — runtime glue belongs next to the shim, not in the app logic.
crate-type = ["rlib"]

[features]
default = []
std = ["symbian-ui/std"]
# The dev bridge, off by default: a signed release build must not ship a service
# that accepts file writes from anything on the LAN. `tools/symbuild` turns it on
# when EPOCADB_HOST is set in api.conf. The bridge itself lives in the SDK
# (`symbian_app::devbridge`); this only forwards the switch.
dev-bridge = ["symbian-app/dev-bridge"]

# Host-only: the simulator and the contact sheets. Neither reaches the device build, which
# is the point of them living here rather than under [dependencies].
[dev-dependencies]
symbian-sim = { workspace = true }
symbian-preview = { workspace = true }
symbian-gfx = { workspace = true }

[dependencies]
symbian-ui = { workspace = true }
symbian = { workspace = true }
# For the dev bridge, which is a module of the SDK rather than of this app.
symbian-app = { workspace = true }
symbian-sys = { workspace = true }
symbian-crypto = { workspace = true }
tg-proto = { workspace = true }
