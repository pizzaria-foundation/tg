# The Telegram client for Symbian, built on the epoc SDK.
#
# Its own workspace now: the fields below used to be inherited from the SDK's root manifest,
# and the SDK crates used to be path dependencies two directories up. Both are pinned here
# instead — see the note at the top of README.md for how to build against a local checkout
# instead of the published SDK.

[workspace]
members = [".", "proto"]
# device/ is deliberately absent: it is a no_std staticlib carrying a #[panic_handler], which
# collides with std's when cargo builds the test harness. It is its own workspace root, built
# only for the ARM target.
exclude = ["device"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
tg-proto = { path = "proto" }
# The SDK. Over SSH rather than HTTPS because the epoc repository is private: an https git
# dependency to a private repo fails with "revision not found", which is cargo reporting a
# permission problem as a missing commit. Pinned by revision rather than by branch so a build
# is reproducible: bump these deliberately, together, and run the device build before
# trusting the result.
symbian = { git = "ssh://git@github.com/pizzaria-foundation/epoc", rev = "c92132676873ac02a39cb88ef42bffe61b59684b" }
symbian-ui = { git = "ssh://git@github.com/pizzaria-foundation/epoc", rev = "c92132676873ac02a39cb88ef42bffe61b59684b" }
symbian-gfx = { git = "ssh://git@github.com/pizzaria-foundation/epoc", rev = "c92132676873ac02a39cb88ef42bffe61b59684b" }
symbian-sys = { git = "ssh://git@github.com/pizzaria-foundation/epoc", rev = "c92132676873ac02a39cb88ef42bffe61b59684b" }
symbian-app = { git = "ssh://git@github.com/pizzaria-foundation/epoc", rev = "c92132676873ac02a39cb88ef42bffe61b59684b" }
symbian-crypto = { git = "ssh://git@github.com/pizzaria-foundation/epoc", rev = "c92132676873ac02a39cb88ef42bffe61b59684b" }
symbian-sim = { git = "ssh://git@github.com/pizzaria-foundation/epoc", rev = "c92132676873ac02a39cb88ef42bffe61b59684b" }
symbian-preview = { git = "ssh://git@github.com/pizzaria-foundation/epoc", rev = "c92132676873ac02a39cb88ef42bffe61b59684b" }
symbian-decl-ui = { git = "ssh://git@github.com/pizzaria-foundation/epoc", rev = "c92132676873ac02a39cb88ef42bffe61b59684b" }

# Mirrors the SDK's device profile: small binaries matter on a phone with ~30 MB of usable
# RAM and a ~100 KB-per-page demand loader.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
debug = false
overflow-checks = false

[package]
name = "tg"
description = "Telegram client for Symbian — UI first, protocol later"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
# Named rather than inherited: this crate's home is its own repository, not the SDK's. See
# the note at the top of README.md.
repository = "https://github.com/pizzaria-foundation/tg"

[lib]
# A plain rlib. The device build wraps this in a thin staticlib crate that
# supplies #[global_allocator], #[panic_handler] and the extern "C" entry points
# — runtime glue belongs next to the shim, not in the app logic.
crate-type = ["rlib"]

[features]
default = []
std = ["symbian-ui/std"]

# Host-only: the simulator and the contact sheets. Neither reaches the device build, which
# is the point of them living here rather than under [dependencies].
[dev-dependencies]
symbian-sim = { workspace = true }
symbian-preview = { workspace = true }
symbian-gfx = { workspace = true }

[dependencies]
symbian-ui = { workspace = true }
symbian = { workspace = true }
# For the dev bridge, which is a module of the SDK rather than of this app.
symbian-app = { workspace = true }
symbian-sys = { workspace = true }
symbian-crypto = { workspace = true }
tg-proto = { workspace = true }
# The declarative screen layer. One screen is written against it today (`chats_decl`) and compared
# pixel-for-pixel with the hand-written one; see that module's header for what the comparison is
# for and what it has found.
symbian-decl-ui = { workspace = true }

# Local SDK checkout, for developing this app and the SDK together — and it stays on this machine
# whatever the pins say. The `rev` pins above are the source of truth for anyone else: they now point
# at an SDK commit that carries every crate this app names, `symbian-decl-ui` included, so a clean
# clone builds without these lines. Bump them together, and run the device build before trusting the
# result — a host build cannot tell you that the ARM link still resolves.
[patch."ssh://git@github.com/pizzaria-foundation/epoc"]
symbian = { path = "../SDK/crates/symbian" }
symbian-ui = { path = "../SDK/crates/symbian-ui" }
symbian-gfx = { path = "../SDK/crates/symbian-gfx" }
symbian-sys = { path = "../SDK/crates/symbian-sys" }
symbian-app = { path = "../SDK/crates/symbian-app" }
symbian-crypto = { path = "../SDK/crates/symbian-crypto" }
symbian-sim = { path = "../SDK/crates/symbian-sim" }
symbian-preview = { path = "../SDK/crates/symbian-preview" }
symbian-decl-ui = { path = "../SDK/crates/symbian-decl-ui" }

# `test = true` so `cargo test` runs the parity assertion, not only an explicit
# `--example chats_parity`. A comparison nobody runs is a comparison that is already stale — and this
# one is the acceptance criterion for the declarative rewrite of the screen, so it has to be able to
# fail the build. Same standing as `symbian-decl-ui`'s `compare` example.
[[example]]
name = "chats_parity"
test = true

# The login screens' comparison, on the same footing and for the same reason.
[[example]]
name = "login_parity"
test = true

# And the viewer's. The conversation's lives in `src/conv_decl.rs` instead — its state cannot be
# assembled from outside the crate, and inventing constructors so a comparison can exist is how a
# test starts deciding what the code looks like.
[[example]]
name = "viewer_parity"
test = true
