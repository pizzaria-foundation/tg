# Build manifest for the Telegram client. Sourced by tools/symbuild.

NAME=telegram
VENDOR="RustSdkDev"
VERSION=0,1,0

# 0xE is the unprotected development block. This one value becomes three things
# that must agree: the E32 header UID3, the UID3 in data/telegram_reg.rss, and
# KUidShimApp in the shim (via -DSHIM_APP_UID3). symbuild wires all three.
UID3=0xE1234569

# MTProto is linked now, so the socket server is reachable and NetworkServices is
# genuinely used rather than requested speculatively. WriteUserData is for the
# auth key: it lives under the private path, which needs no capability, but the
# self test writes its report outside it and this app will want the same escape.
#
# Quoted and joined with +, because bash otherwise runs the second word as a
# command -- which produces a build that succeeds with one capability missing.
CAPABILITIES="NetworkServices+WriteUserData"

# All the C++ comes from the shared shim — this app has none of its own. That is
# the point of the shim: the app is Rust.
USE_SHIM=1
# AppArc, for one call: bringing the launcher to the foreground when a link is pressed and it is not
# already running. Every AppArc call this app makes (`StartApp`) is the part shim_apparc.cpp
# documents as present and safe on this handset — the risky ones are the icon paths, and they are
# behind their own gates (USE_APPICON / USE_AKNICON) which this app does not turn on.
USE_APPARC=1
# USE_LAUNCH_DOC for one case only: no launcher installed, so there is no registry to consult and
# nobody to ask. Then this falls back to what the phone itself would do — hand the address to the
# platform's browser. With a launcher present it is never reached.
#
# Still no reading of the registry and no choosing between applications: which app opens a scheme is
# one decision in one place for the whole phone, and a fallback for its absence is not a second copy
# of it.
USE_LAUNCH_DOC=1
# The system clipboard, both directions: `bafl` and `etext`, and shim_clip.cpp compiled in.
#
# What it buys is the thing a phone does that this app could not: a code copied from an SMS pasted
# into the login field, an address from the browser pasted into a message, a message copied out to
# anywhere else. Ctrl+C/X/V and Shift+arrow selection are the SDK's, in every text field — this line
# is all an app pays for them. Copying a highlighted message is this app's own (see `conv.rs`).
#
# The risk it carries is the usual one for an import: a DLL that will not resolve stops the whole
# image loading, with no panic and no log. `bafl` and `etext` are on every S60 3rd FP2 handset — the
# platform's own editors use them — which is why this is a smaller bet than the icon paths that stay
# behind their gates.
USE_CLIPBOARD=1
# Pulls in shim_net.cpp and shim_work.cpp and links esock, insock, commdb and
# netmeta. Opt-in because --no-undefined checks referenced symbols before
# --gc-sections can sweep them, so an app that never opens a socket would
# otherwise import the socket server for nothing.
USE_NET=1
CXX_SOURCES=""
RUST_CRATE=device

# 4 MB heap ceiling. The mock store is a few kilobytes, but the RGB565 staging
# buffer is 150 KB and the font atlases are static, so the headroom is for message
# text and the transcript layout. The E72 has ~45 MB free, so this is not tight.
HEAP=0x1000,0x400000
STACK=0x8000

# Debug logging. 1 compiles `symbian::log!` call sites in and points them at
# C:\Data\_logs\telegram.txt. 0 removes them, string and all. Needs no capability, no host and
# no network: read it back with `epoc logs telegram` (or `-f` to follow it).
DEBUG=1

# The dev handset has a patched installserver; see tools/symbuild.
SIGN=0
USE_IMAGE=1
# Voice messages. Pulls in mediaclientaudio.dll; playback needs no capability.
USE_AUDIO=1

