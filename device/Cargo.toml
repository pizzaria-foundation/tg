# Its own workspace root, not a member of the one above.
#
# A crate that defines #[panic_handler] and #[global_allocator] cannot be built for
# the host at all: `cargo test` links the harness against std, which already
# defines both lang items. Excluding it keeps `cargo test --workspace` green, and
# costs nothing — nothing depends on this crate, and it only ever builds for ARM.
[workspace]

[package]
name = "tg-device"
description = "Device entry points and runtime glue for the Telegram client"
# Spelled out, not inherited: the `[workspace]` above makes this its own root, so
# there is no parent `workspace.package` to inherit from. Keep in step with the
# root Cargo.toml.
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
publish = false

[lib]
# The only staticlib in the tree. arm-none-symbianelf-ld links this together with
# the C++ shim objects; Rust itself never links, which keeps LLVM's total
# ignorance of Symbian confined to the object boundary.
crate-type = ["staticlib"]

# Explicit rather than `workspace = true`, since this crate has no parent workspace to
# inherit from.
[dependencies]
tg = { path = ".." }
tg-proto = { path = "../proto" }
# The SDK, by revision. Keep this in step with the root manifest's pins.
symbian-app = { git = "ssh://git@github.com/pizzaria-foundation/epoc", rev = "f2451dc2fe3a182e2e5e02e3c753440d7c073d0c" }

# The local checkout, same as the root manifest's `[patch]`.
#
# A separate workspace root inherits nothing from the one above it — not the profile, and not the
# patch table. Without this block the device build resolved the whole SDK from git at the pinned
# revision while `cargo test` at the root resolved it from `../SDK`, so **the two disagreed silently
# and the packaged .sis was built from different source than everything that was tested.** It
# surfaced only when the root grew a dependency on `symbian-decl-ui`, which does not exist at the
# pinned revision, and resolution failed outright. Until then it had been quietly wrong: every local
# SDK change reached the tests and none of them reached the phone.
#
# Keep this list in step with the root manifest's `[patch]`, and the `rev` pins in step with each
# other.
[patch."ssh://git@github.com/pizzaria-foundation/epoc"]
symbian = { path = "../../SDK/crates/symbian" }
symbian-ui = { path = "../../SDK/crates/symbian-ui" }
symbian-gfx = { path = "../../SDK/crates/symbian-gfx" }
symbian-sys = { path = "../../SDK/crates/symbian-sys" }
symbian-app = { path = "../../SDK/crates/symbian-app" }
symbian-crypto = { path = "../../SDK/crates/symbian-crypto" }
symbian-sim = { path = "../../SDK/crates/symbian-sim" }
symbian-preview = { path = "../../SDK/crates/symbian-preview" }
symbian-decl-ui = { path = "../../SDK/crates/symbian-decl-ui" }

# Mirrors the root workspace profile; a separate workspace does not inherit it.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
debug = false
overflow-checks = false
